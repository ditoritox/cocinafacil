<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Encuentra recetas con los ingredientes que tienes. Escanea tu refrigerador con la camara.">
  <meta name="theme-color" content="#16a34a">
  <title>CocinaFacil</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CocinaFacil">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

<div id="install-banner" class="install-banner">
  <p>Instalar CocinaFacil como app</p>
  <div class="install-actions">
    <button id="install-btn" class="btn-primary btn-sm">Instalar</button>
    <button id="dismiss-install" class="btn-ghost btn-sm">X</button>
  </div>
</div>

<header class="app-header">
  <span class="header-logo" aria-hidden="true">&#x1F373;</span>
  <h1>CocinaF&#xE1;cil</h1>
</header>

<main class="app-main">

  <section class="card scan-card">
    <button id="camera-btn" class="btn-camera" aria-label="Escanear ingredientes con camara">
      <span class="camera-icon" aria-hidden="true">&#x1F4F7;</span>
      <span class="camera-label">Escanear ingredientes</span>
      <span class="camera-hint">Saca foto de tu refri o despensa y detecto los ingredientes</span>
    </button>
    <input id="ocr-input" type="file" accept="image/*" capture="environment" aria-hidden="true" tabindex="-1">
    <div id="ocr-progress" class="ocr-progress">
      <div class="progress-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="ocr-status" class="ocr-status" aria-live="polite"></p>
    </div>
  </section>

  <section class="card ingredients-card">
    <div class="section-header">
      <h2 class="section-title">Mis ingredientes</h2>
      <button id="clear-all-btn" class="btn-ghost btn-sm">Limpiar todo</button>
    </div>
    <div class="add-row">
      <input
        id="ingredient-input"
        type="text"
        class="text-input"
        placeholder="Ej: pollo, tomate, arroz..."
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        maxlength="60"
        aria-label="Nombre del ingrediente"
      >
      <button id="add-btn" class="btn-add">&#x2B; A&#xF1;adir</button>
    </div>
    <ul id="ingredients-list" class="ingredients-list" aria-label="Lista de ingredientes" aria-live="polite"></ul>
    <p id="empty-hint" class="empty-hint">A&#xF1;ade ingredientes arriba o escanea tu refrigerador &#x261D;</p>
  </section>

</main>

<div class="search-sticky">
  <button id="search-btn" class="btn-search" disabled aria-label="Buscar recetas">
    &#x1F50D; Buscar Recetas
  </button>
</div>

<section id="results-section" class="results-section" style="display:none" aria-live="polite">
  <div class="results-header">
    <h2 class="section-title">&#x1F37D;&#xFE0F; Recetas</h2>
    <span id="result-count" class="result-count"></span>
  </div>
  <div id="recipes-grid" class="recipes-grid"></div>
</section>

<div id="qty-overlay" class="qty-overlay" aria-hidden="true">
  <div id="qty-sheet" class="qty-sheet" role="dialog" aria-label="Cantidad del ingrediente">
    <div class="qty-handle" aria-hidden="true"></div>
    <p class="qty-question">
      &#xBF;Cu&#xE1;nto/a tienes de<br>
      <strong id="qty-ingredient-name"></strong>?
    </p>
    <input
      id="qty-input"
      type="text"
      class="text-input"
      placeholder="Ej: 500g, 2 pechugas, 1 lata... (opcional)"
      autocomplete="off"
      maxlength="40"
      aria-label="Cantidad del ingrediente"
    >
    <div class="qty-actions">
      <button id="qty-skip" class="btn-ghost">Sin cantidad</button>
      <button id="qty-confirm" class="btn-primary">&#x2713; A&#xF1;adir</button>
    </div>
  </div>
</div>

<div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-label="Detalle de receta">
  <div id="modal-content" class="modal"></div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
